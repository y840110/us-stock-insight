// Main: SPY candlestick + trade markers
const mainChart = LightweightCharts.createChart(document.getElementById("main"),{
  layout:{background:{color:"#0d1117"},textColor:"#e6edf3"},
  grid:{vertLines:{color:"#21262d"},horzLines:{color:"#21262d"}},
  width:window.innerWidth,height:window.innerHeight*0.52,
  timeScale:{timeVisible:true,secondsVisible:false,borderColor:"#30363d"},
  rightPrice:{borderColor:"#30363d"},
});

const cs = mainChart.addCandlestickSeries({
  upColor:"#26a69a",downColor:"#ef5350",
  borderUpColor:"#26a69a",borderDownColor:"#ef5350",
  wickUpColor:"#26a69a",wickDownColor:"#ef5350",
});
cs.setData(candles);
cs.setMarkers(markers);
mainChart.timeScale().fitContent();

// Equity comparison chart
const eqChart = LightweightCharts.createChart(document.getElementById("eq"),{
  layout:{background:{color:"#0d1117"},textColor:"#e6edf3"},
  grid:{vertLines:{color:"#21262d"},horzLines:{color:"#21262d"}},
  width:window.innerWidth,height:window.innerHeight*0.48,
  timeScale:{timeVisible:true,secondsVisible:false,borderColor:"#30363d"},
  rightPrice:{borderColor:"#30363d"},
});

const eqS = eqChart.addLineSeries({color:"#FFD700",lineWidth:2,title:"v6"});
eqS.setData(eqStrat);
const eqB = eqChart.addLineSeries({color:"#58a6ff",lineWidth:1,title:"B&H"});
eqB.setData(eqBH);
eqChart.timeScale().fitContent();

// Sync time scales
mainChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
  if (r) eqChart.timeScale().setVisibleLogicalRange(r);
});
eqChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
  if (r) mainChart.timeScale().setVisibleLogicalRange(r);
});

window.addEventListener("resize", () => {
  mainChart.resize(window.innerWidth, window.innerHeight*0.52);
  eqChart.resize(window.innerWidth, window.innerHeight*0.48);
});
