[tool.poetry]
name = "us-stock-investment-analysis"
version = "0.1.0"
description = "AI 辅助美股投资决策系统"
authors = ["Jax"]

[tool.poetry.dependencies]
python = "&gt;=3.10,&lt;3.13"
numpy = "&gt;=1.24.0"
pandas = "&gt;=2.0.0"
scipy = "&gt;=1.10.0"
scikit-learn = "&gt;=1.3.0"
joblib = "&gt;=1.3.0"
matplotlib = "&gt;=3.7.0"
plotly = "&gt;=5.14.0"
yfinance = "&gt;=0.2.0"
requests = "&gt;=2.31.0"
beautifulsoup4 = "&gt;=4.12.0"
selenium = "&gt;=4.10.0"
ta = "&gt;=0.10.0"
python-dotenv = "&gt;=1.0.0"
tqdm = "&gt;=4.65.0"

[tool.poetry.dev-dependencies]
ipython = "&gt;=8.0.0"
jupyter = "&gt;=1.0.0"

[build-system]
requires = ["poetry-core&gt;=1.0.0"]
build-backend = "poetry.core.masonry.api"
